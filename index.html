<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-10822846375"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-10822846375');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>NIJ &amp; BIJ | Age Verification</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --green:      #2D5C3F;
      --green-mid:  #4A8060;
      --cream:      #F2EDE3;
      --warm-white: #FAF7F2;
      --text:       #1E3F2B;
      --text-muted: #5A7A65;
      --border:     #D5CDBE;
      --font:       'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--warm-white);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 24px;
    }

    .gate-wrap {
      background: #FAF7F2;
      border-radius: 20px;
      padding: 56px 48px 48px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    @media (max-width: 480px) {
      .gate-wrap { padding: 40px 28px 36px; }
    }

    .gate-brand {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 24px;
    }

    .gate-title {
      font-size: clamp(1.5rem, 3vw, 1.85rem);
      font-weight: 800;
      color: #1C2B1E;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .gate-sub {
      font-size: 0.94rem;
      color: #6B7C72;
      line-height: 1.65;
      margin: 0 auto 32px;
      max-width: 320px;
    }

    .gate-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-family: var(--font);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      text-align: center;
      letter-spacing: 0.06em;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .gate-input::-webkit-outer-spin-button,
    .gate-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .gate-input:focus { border-color: var(--green); }
    .gate-input.error { border-color: #b83232; }

    .gate-error {
      font-size: 0.8rem;
      color: #b83232;
      margin-top: 8px;
      min-height: 1.2em;
      text-align: center;
    }

    .gate-btn {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--font);
      background: var(--green);
      color: #F2EDE3;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .gate-btn:hover { background: var(--green-mid); transform: translateY(-1px); }
    .gate-btn:active { transform: translateY(0); }

    .gate-legal {
      font-size: 0.7rem;
      color: #AABAA8;
      line-height: 1.55;
      margin-top: 24px;
    }

    .gate-denied-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1C2B1E;
      margin-bottom: 14px;
    }
    .gate-denied-msg {
      font-size: 0.95rem;
      color: #6B7C72;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <div class="gate-wrap" id="gate-check">
    <p class="gate-brand">NIJ &amp; BIJ</p>
    <h1 class="gate-title">Welcome to NIJ &amp; BIJ</h1>
    <p class="gate-sub">Our products contain alcohol. Please enter your year of birth to continue.</p>
    <input
      type="number"
      id="birth-year"
      class="gate-input"
      placeholder="Year of birth (YYYY)"
      min="1900"
      max="2010"
      inputmode="numeric"
      autocomplete="bday-year"
      aria-label="Year of birth"
    >
    <p class="gate-error" id="gate-error" aria-live="polite"></p>
    <button class="gate-btn" id="gate-btn">Enter Site</button>
    <p class="gate-legal">By entering, you confirm you are of legal drinking age in your country.</p>
  </div>

  <div class="gate-wrap" id="gate-denied" style="display:none" role="alert">
    <p class="gate-brand">NIJ &amp; BIJ</p>
    <p class="gate-denied-title">Access Restricted</p>
    <p class="gate-denied-msg">Sorry, this site is intended for adults only. You must be 18 or older to enter.</p>
  </div>

  <script>
    (function () {
      'use strict';

      if (sessionStorage.getItem('ageVerified')) { loadSite(); return; }

      var input   = document.getElementById('birth-year');
      var errorEl = document.getElementById('gate-error');

      document.getElementById('gate-btn').addEventListener('click', verify);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });

      function verify() {
        var val  = input.value.trim();
        var year = parseInt(val, 10);
        var now  = new Date().getFullYear();
        errorEl.textContent = '';
        input.classList.remove('error');

        if (!val || isNaN(year) || val.length !== 4 || year < 1900 || year > now) {
          errorEl.textContent = 'Please enter a valid year of birth.';
          input.classList.add('error');
          return;
        }

        if (now - year >= 18) {
          sessionStorage.setItem('ageVerified', '1');
          loadSite();
        } else {
          document.getElementById('gate-check').style.display = 'none';
          document.getElementById('gate-denied').removeAttribute('style');
        }
      }

      function loadSite() {
        window.location.href = 'app.html';
      }
    })();
  </script>

</body>
</html>
